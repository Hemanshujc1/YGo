name: Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

# Third-party actions are pinned to a commit, not a tag: the repository is
# public and a moved tag would run someone else's code with this token.
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # apps/server's tests create a fresh database on this server for each run.
    # The image is pinned to a digest for the same reason as the actions.
    services:
      postgres:
        image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
        env:
          POSTGRES_USER: ygo
          POSTGRES_PASSWORD: ygo
          POSTGRES_DB: ygo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U ygo -d ygo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ygo:ygo@localhost:5432/ygo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check operational scripts
        run: |
          bash -n ops/setup-host.sh ops/deploy.sh ops/backup.sh ops/restore.sh ops/monitoring.sh scripts/overlap.sh
          shellcheck ops/setup-host.sh ops/deploy.sh ops/backup.sh ops/restore.sh ops/monitoring.sh scripts/overlap.sh
          python3 ops/test-monitoring.py
          python3 ops/test-off-aws-check.py
          python3 scripts/test-gate-lock.py

      # The restore and deployment tests below take over a minute. A pull
      # request runs them only when it changes what they exercise: the ops
      # scripts, the workflows, or the server build (turbo traces its sources,
      # workspace packages and lockfile entries). If turbo cannot answer, they
      # run. Pushes to main always run them.
      - name: Find what the pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          if ! server=$(pnpm exec turbo query affected --tasks build --packages @ygo/server --base HEAD^1 --head HEAD | jq '.data.affectedTasks.length'); then
            server=unknown
          fi
          echo "Server build tasks affected: $server"
          if [[ $server != 0 ]] || git diff --name-only HEAD^1 HEAD | grep -E '^(ops|\.github/workflows)/'; then
            echo "ops=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deployment workflow and promotion
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          python3 ops/test-dispatch.py

      # A pull request reuses turbo's cache from main and from its own earlier
      # runs, so only the tasks whose inputs changed run again. Turbo's hash
      # covers each task's files, dependencies and lockfile entries; the key
      # adds this workflow, which turbo cannot see (the Postgres image, the
      # steps). main restores nothing, so every push to main runs every task,
      # then saves the results for pull requests.
      - name: Restore turbo cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.github/workflows/gate.yml') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ hashFiles('.github/workflows/gate.yml') }}-

      - run: pnpm gate

      - name: Save turbo cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('.github/workflows/gate.yml') }}-${{ github.sha }}

      - name: Exercise exact production restore script
        if: github.event_name == 'push' || steps.changes.outputs.ops == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          export YGO_SYSTEMD_TRACE="$RUNNER_TEMP/ygo-systemd-run.jsonl"
          sudo --preserve-env=PATH,TEST_DATABASE_URL,GITHUB_ACTIONS,YGO_SYSTEMD_TRACE python3 ops/test-restore.py
          docker run --rm --platform linux/amd64 -v "$PWD/ops:/ops:ro" -v "$YGO_SYSTEMD_TRACE:/systemd-args.jsonl:ro" amazonlinux:2023@sha256:8ed3c0a996841537f75607e7d1de2114d8150391f75792e8da9268738547e73f \
            bash -lc 'dnf -qy install systemd >/dev/null && python3 /ops/test-systemd-compat.py /systemd-args.jsonl'

      - name: Exercise exact host deployment script
        if: github.event_name == 'push' || steps.changes.outputs.ops == 'true'
        run: sudo --preserve-env=PATH,TEST_DATABASE_URL,GITHUB_ACTIONS python3 ops/test-deploy.py

  # PRD Q-9: no secret is ever committed. Scans the full history, so a secret
  # added in one commit and deleted in the next is still caught.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks

      - name: Scan history
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 .'
